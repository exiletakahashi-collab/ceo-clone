<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社長AIクローン - 管理ダッシュボード</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <div class="dashboard-header">
      <h1>社長AIクローン ダッシュボード</h1>
      <a href="/chat" style="color:var(--primary);text-decoration:none;font-size:14px;">チャット画面 →</a>
    </div>

    <!-- 統計カード -->
    <div class="stats-grid" id="stats">
      <div class="stat-card"><div class="label">総リード</div><div class="value" id="totalLeads">-</div></div>
      <div class="stat-card hot"><div class="label">ホットリード</div><div class="value" id="hotLeads">-</div><div class="sub">スコア70+</div></div>
      <div class="stat-card"><div class="label">今日の新規</div><div class="value" id="todayLeads">-</div></div>
      <div class="stat-card"><div class="label">総会話数</div><div class="value" id="totalMessages">-</div></div>
      <div class="stat-card"><div class="label">LINE経由</div><div class="value" id="lineLeads">-</div></div>
      <div class="stat-card"><div class="label">Web経由</div><div class="value" id="webLeads">-</div></div>
    </div>

    <!-- リード一覧 -->
    <div class="leads-table">
      <h2>リード一覧</h2>
      <table>
        <thead>
          <tr>
            <th>名前</th>
            <th>業種</th>
            <th>課題</th>
            <th>スコア</th>
            <th>ステータス</th>
            <th>チャネル</th>
            <th>日時</th>
          </tr>
        </thead>
        <tbody id="leadsBody">
          <tr><td colspan="7" style="text-align:center;color:var(--text-light);padding:40px;">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- 会話ログモーダル -->
    <div class="modal-overlay" id="modal">
      <div class="modal">
        <button class="close-btn" onclick="closeModal()">&times;</button>
        <h3 id="modalTitle">会話ログ</h3>
        <div class="conv-log" id="convLog"></div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
